directives:
# add environment
- add_model:
    name: environment
    file: package://drake_project/script/benchmark_description/environment.urdf
- add_weld:
    parent: world
    child: environment::robot_base

# add gp7
- add_model:
    name: gp7
    file: package://drake_project/script/benchmark_description/gp7_motoman.urdf

- add_frame:
    name: gp7_origin
    X_PF:
      base_frame: world
      translation: [3.26323, 0.385807, 0.922866]

- add_weld:
    parent: gp7_origin
    child: gp7::base_link

